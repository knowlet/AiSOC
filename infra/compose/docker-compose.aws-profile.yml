# Optional: expose the host's existing AWS profiles to the gateway only.
# No mount is needed for an EC2 instance role or an environment bearer token.
# Refresh SSO on the host first; this mount is intentionally read-only.
# Use the same COMPOSE value for up, upgrade and llm-reload:
# make up COMPOSE="docker compose -f docker-compose.yml -f infra/compose/docker-compose.aws-profile.yml"
services:
  litellm:
    volumes:
      - type: bind
        source: ${AISOC_AWS_CONFIG_DIR:-${HOME}/.aws}
        target: /root/.aws
        read_only: true
        bind:
          create_host_path: false
